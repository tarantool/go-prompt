version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - lll
    - govet
    - staticcheck
    - godot
  settings:
    lll:
      line-length: 100
      tab-width: 4
    staticcheck:
      # The style checks only, as stylecheck ran them before it became a part
      # of staticcheck. Temporary disable "Poorly chosen identifier" check.
      checks: ["ST*", "-ST1003"]
    godot:
      scope: toplevel
      period: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: "\t?// (see )?https://"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
