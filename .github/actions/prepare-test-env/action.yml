name: "Prepare test environment"
description: "Prepares test environment"

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '${{ env.GO_VERSION }}'

    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '${{ env.PYTHON_VERSION }}'
